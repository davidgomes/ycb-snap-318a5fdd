- case: bind_validated_and_flow
  disable_cache: false
  main: |
    from returns.validated import Validated
    from returns.pointfree import bind_validated
    from returns.pipeline import flow

    def test(arg: int) -> Validated[float, str]:
        ...

    def second(arg: float) -> Validated[bool, str]:
        ...

    r: Validated[int, str]
    reveal_type(flow(r, bind_validated(test), bind_validated(second)))  # N: Revealed type is "returns.validated.Validated[builtins.bool, builtins.str]"


- case: bind_validated_validated
  disable_cache: false
  main: |
    from returns.pointfree import bind_validated
    from returns.validated import Validated

    def test(arg: float) -> Validated[int, str]:
        ...

    x: Validated[float, str]
    reveal_type(bind_validated(test)(x))  # N: Revealed type is "returns.validated.Validated[builtins.int, builtins.str]"


- case: bind_validated_wrong_second_type
  disable_cache: false
  main: |
    from returns.pointfree import bind_validated
    from returns.validated import Validated

    def test(arg: float) -> Validated[int, str]:
        ...

    x: Validated[float, int]
    bind_validated(test)(x)  # E: Argument 1 has incompatible type "Validated[float, int]"; expected "KindN[Validated[Any, Any], float, str, Never]"  [arg-type]


- case: bind_validated_result_is_not_supported
  disable_cache: false
  main: |
    from returns.pointfree import bind_validated
    from returns.result import Result
    from returns.validated import Validated

    def test(arg: float) -> Validated[int, str]:
        ...

    x: Result[float, str]
    bind_validated(test)(x)  # E: Value of type variable "_ValidatedLikeKind" of function cannot be "Result[Any, Any]"  [type-var]
