kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: example-gateway
spec:
  gatewayClassName: kgateway
  listeners:
    - protocol: HTTP
      port: 8080
      name: http
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
spec:
  selector:
    test: example-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hash-route
spec:
  parentRefs:
    - name: example-gateway
      namespace: default
  hostnames:
    - "example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: example-svc
          port: 8000
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: consistent-hash
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hash-route
  consistentHash:
    headers:
      - headerName: X-User
        regexRewrite:
          pattern: "^user-(.*)$"
          substitution: '\1'
        terminal: true
      - headerName: x-user
      - headerName: X-Other
    cookies:
      - name: session
        ttl: 1h30m
        path: /api
        attributes:
          - name: SameSite
            value: Strict
          - name: Secure
            value: "true"
      - name: session
        ttl: "60"
      - name: alt
        ttl: "3600"
    queryParameters:
      - name: user
      - name: user
        terminal: true
      - name: region
        terminal: true
    filterState:
      - key: envoy.router
      - key: envoy.router
    sourceIp:
      terminal: false
