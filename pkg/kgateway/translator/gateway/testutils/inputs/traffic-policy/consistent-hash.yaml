# This test contains:
# - a route with a TrafficPolicy that configures all consistentHash fields, including duplicate
#   entries that are expected to be dropped
# - a route with a TrafficPolicy that sets an empty consistentHash, which defaults to hashing the
#   source IP
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: example-gateway
spec:
  gatewayClassName: kgateway
  listeners:
    - protocol: HTTP
      port: 8080
      name: http
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
spec:
  selector:
    test: example-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: consistent-hash-route
spec:
  parentRefs:
    - name: example-gateway
  hostnames:
    - "example.com"
  rules:
    - backendRefs:
        - name: example-svc
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: consistent-hash-default-route
spec:
  parentRefs:
    - name: example-gateway
  hostnames:
    - "default.example.com"
  rules:
    - backendRefs:
        - name: example-svc
          port: 8000
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: consistent-hash-policy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: consistent-hash-route
  consistentHash:
    sourceIp:
      terminal: true
    filterState:
      - key: io.istio.peer_principal
      - key: io.istio.peer_principal
        terminal: true
    queryParameters:
      - name: user
        terminal: true
      - name: user
    cookies:
      - name: session-id
        ttl: 1h30m
        path: /api
        attributes:
          - name: SameSite
            value: Strict
          - name: Secure
          - name: HttpOnly
        terminal: true
      - name: legacy-session
        ttl: "3600"
      - name: session-id
        ttl: 10s
    headers:
      - headerName: x-user-id
        terminal: true
      - headerName: X-Tenant
        regexRewrite:
          pattern: "^tenant-(.*)$"
          substitution: "\\1"
      - headerName: X-USER-ID
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: consistent-hash-default-policy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: consistent-hash-default-route
  consistentHash: {}
