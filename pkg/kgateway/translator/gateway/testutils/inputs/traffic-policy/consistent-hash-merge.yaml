kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: example-gateway
spec:
  gatewayClassName: kgateway
  listeners:
    - protocol: HTTP
      port: 8080
      name: http
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
spec:
  selector:
    test: example-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hash-route
spec:
  parentRefs:
    - name: example-gateway
      namespace: default
  hostnames:
    - "example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: example-svc
          port: 8000
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: consistent-hash-high
  annotations:
    kgateway.dev/policy-weight: "10"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hash-route
  consistentHash:
    headers:
      - headerName: X-User
        terminal: true
    cookies:
      - name: session
        ttl: 1h30m
    queryParameters:
      - name: user
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: consistent-hash-low
  annotations:
    kgateway.dev/policy-weight: "0"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hash-route
  consistentHash:
    headers:
      - headerName: x-user
      - headerName: X-Low
    cookies:
      - name: other
        ttl: "3600"
        path: /api
        attributes:
          - name: SameSite
            value: Lax
          - name: Secure
            value: "true"
    queryParameters:
      - name: extra
        terminal: true
    filterState:
      - key: envoy.router
        terminal: true
    sourceIp:
      terminal: true
