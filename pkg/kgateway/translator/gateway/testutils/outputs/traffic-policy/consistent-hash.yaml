      filterMetadata:
        merge.TrafficPolicy.gateway.kgateway.dev:
          consistentHash:
          - gateway.kgateway.dev/TrafficPolicy/default/listener-hash-policy
    name: listener~8080~disabled_example_com
    routes:
    - match:
        pathSeparatedPrefix: /disabled
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            consistentHash:
            - gateway.kgateway.dev/TrafficPolicy/default/disable-hash-policy
      name: listener~8080~disabled_example_com-route-0-httproute-disabled-hash-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_8000
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
  - domains:
    - full.example.com
