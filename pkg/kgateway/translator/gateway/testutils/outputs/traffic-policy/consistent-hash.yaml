        pathSeparatedPrefix: /merged
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            consistentHash:
            - gateway.kgateway.dev/TrafficPolicy/default/listener-hash-policy
            - gateway.kgateway.dev/TrafficPolicy/default/merge-high
            - gateway.kgateway.dev/TrafficPolicy/default/merge-low
      name: listener~8080~merged_example_com-route-0-httproute-merged-hash-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_8000
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        hashPolicy:
        - header:
            headerName: X-User
          terminal: true
        - header:
            headerName: X-Extra
        - cookie:
            name: high
        - cookie:
            name: low
            ttl: 30s
        - cookie:
            attributes:
            - name: SameSite
              value: Lax
            - name: Secure
              value: "true"
            name: session
            path: /app
            ttl: 5400s
          terminal: true
        - queryParameter:
            name: user
        - filterState:
            key: io.kgateway.user
