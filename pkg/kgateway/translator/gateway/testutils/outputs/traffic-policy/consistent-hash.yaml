Clusters:
- connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  metadata: {}
  name: kube_default_example-svc_80
  type: EDS
- connectTimeout: 5s
  metadata: {}
  name: test-backend-plugin_default_example-svc_80
Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 80
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        httpFilters:
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~80
        statPrefix: http
        useRemoteAddress: true
    name: listener~80
  name: listener~80
Routes:
- ignorePortInHostMatching: true
  name: listener~80
  virtualHosts:
  - domains:
    - disabled.example.com
    name: listener~80~disabled_example_com
    routes:
    - match:
        prefix: /
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            consistentHash:
            - gateway.kgateway.dev/TrafficPolicy/default/example-route-disabled
      name: listener~80~disabled_example_com-route-0-httproute-example-route-disabled-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
  - domains:
    - empty.example.com
    name: listener~80~empty_example_com
    routes:
    - match:
        prefix: /
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            consistentHash:
            - gateway.kgateway.dev/TrafficPolicy/default/example-route-empty
      name: listener~80~empty_example_com-route-0-httproute-example-route-empty-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        hashPolicy:
        - connectionProperties:
            sourceIp: true
  - domains:
    - full.example.com
    name: listener~80~full_example_com
    routes:
    - match:
        prefix: /
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            consistentHash:
            - gateway.kgateway.dev/TrafficPolicy/default/example-route-full
      name: listener~80~full_example_com-route-0-httproute-example-route-full-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        hashPolicy:
        - header:
            headerName: X-User
            regexRewrite:
              pattern:
                regex: ^user-(.*)$
              substitution: \1
          terminal: true
        - header:
            headerName: X-Tenant
        - cookie:
            attributes:
            - name: SameSite
              value: Lax
            - name: Secure
              value: "true"
            name: session
            path: /app
            ttl: 5400s
          terminal: true
        - cookie:
            name: alt
            ttl: 3600s
        - queryParameter:
            name: user
        - queryParameter:
            name: region
        - filterState:
            key: role
          terminal: true
        - connectionProperties:
            sourceIp: true
          terminal: true
  - domains:
    - merged.example.com
    name: listener~80~merged_example_com
    routes:
    - match:
        prefix: /
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            consistentHash:
            - gateway.kgateway.dev/TrafficPolicy/default/example-route-merged-high
            - gateway.kgateway.dev/TrafficPolicy/default/example-route-merged-low
      name: listener~80~merged_example_com-route-0-httproute-example-route-merged-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        hashPolicy:
        - header:
            headerName: X-User
          terminal: true
        - header:
            headerName: X-Tenant
        - cookie:
            name: session
        - cookie:
            name: alt
        - queryParameter:
            name: region
          terminal: true
        - filterState:
            key: role
        - connectionProperties:
            sourceIp: true
          terminal: true
