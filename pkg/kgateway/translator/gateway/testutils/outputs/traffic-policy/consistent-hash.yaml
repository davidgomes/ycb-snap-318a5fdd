      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            consistentHash:
            - gateway.kgateway.dev/TrafficPolicy/default/full-hash-policy
            - gateway.kgateway.dev/TrafficPolicy/default/listener-hash-policy
      name: listener~8080~full_example_com-route-0-httproute-full-hash-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_8000
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        hashPolicy:
        - header:
            headerName: X-User
            regexRewrite:
              pattern:
                regex: ^user-(.*)$
              substitution: \1
          terminal: true
        - header:
            headerName: X-Tenant
        - cookie:
            attributes:
            - name: HttpOnly
              value: "true"
            name: sticky
            ttl: 3600s
        - cookie:
            attributes:
            - name: SameSite
              value: Lax
            - name: Secure
              value: "true"
            name: session
            path: /app
            ttl: 5400s
          terminal: true
        - queryParameter:
            name: user
          terminal: true
        - queryParameter:
            name: region
        - filterState:
            key: envoy.lb
          terminal: true
        - connectionProperties:
            sourceIp: true
          terminal: true
  - domains:
    - inherit.example.com
