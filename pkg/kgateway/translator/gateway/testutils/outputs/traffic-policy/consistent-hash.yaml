      name: listener~8080~inherit_example_com-route-0-httproute-inherit-hash-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_8000
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        hashPolicy:
        - cookie:
            attributes:
            - name: SameSite
              value: Lax
            - name: Secure
              value: "true"
            name: session
            path: /app
            ttl: 5400s
          terminal: true
        - queryParameter:
            name: user
  - domains:
    - merged.example.com
    metadata:
      filterMetadata:
        merge.TrafficPolicy.gateway.kgateway.dev:
          consistentHash:
          - gateway.kgateway.dev/TrafficPolicy/default/listener-hash-policy
    name: listener~8080~merged_example_com
